<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="192" height="192" role="img" aria-label="Chronos Capsule">
  <defs>
    <clipPath id="ccFrame"><rect width="1024" height="1024" rx="229"/></clipPath>
    <radialGradient id="ccAmb" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#0D1B2E"/>
      <stop offset=".55" stop-color="#050D19"/>
      <stop offset="1" stop-color="#010103"/>
    </radialGradient>
    <linearGradient id="ccRingGrad" gradientUnits="userSpaceOnUse" x1="843" y1="351" x2="181" y2="673">
      <stop offset="0" stop-color="#3AE1FF"/>
      <stop offset="1" stop-color="#D355FF"/>
    </linearGradient>
    <linearGradient id="ccChrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".40" stop-color="#F0F9FF"/>
      <stop offset=".55" stop-color="#C6E7FF"/>
      <stop offset=".78" stop-color="#9ED3F9"/>
      <stop offset="1" stop-color="#7FBFF0"/>
    </linearGradient>
    <linearGradient id="ccSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".13" stop-color="#FFFFFF" stop-opacity=".07"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset=".74" stop-color="#DFF3FF" stop-opacity="0"/>
