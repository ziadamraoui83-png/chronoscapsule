      <stop offset=".38" stop-color="#3AE1FF" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3AE1FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ccHull"><rect x="420" y="280" width="184" height="472" rx="92"/></clipPath>
