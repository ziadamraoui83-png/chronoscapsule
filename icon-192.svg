    <g transform="rotate(10 512 516)">
      <rect x="420" y="280" width="184" height="472" rx="92" fill="url(#ccChrome)"/>
      <rect x="420" y="280" width="184" height="472" rx="92" fill="url(#ccSheen)"/>
      <g clip-path="url(#ccHull)">
