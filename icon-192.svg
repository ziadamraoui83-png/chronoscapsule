      <circle cx="780" cy="480" r="1.2" opacity=".4"/>
      <circle cx="150" cy="420" r="1.5" opacity=".5"/>
      <circle cx="80" cy="620" r="1.3" opacity=".45"/>
      <circle cx="200" cy="780" r="1.7" opacity=".55"/>
      <circle cx="420" cy="850" r="1.4" opacity=".5"/>
      <circle cx="640" cy="820" r="1.5" opacity=".5"/>
      <circle cx="820" cy="750" r="1.2" opacity=".4"/>
      <circle cx="930" cy="620" r="1.6" opacity=".55"/>
