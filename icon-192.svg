      <circle cx="340" cy="290" r="1.3" opacity=".42"/>
      <circle cx="700" cy="290" r="1.4" opacity=".48"/>
      <circle cx="160" cy="340" r="1.2" opacity=".4"/>
      <circle cx="880" cy="470" r="1.3" opacity=".45"/>
      <circle cx="260" cy="600" r="1.1" opacity=".38"/>
