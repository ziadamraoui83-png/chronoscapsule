    let _toastTimer;
    function toast(msg, ico='🛰️'){
        const el = $('arcToast');
        if(!el) return;
        el.innerHTML = `<span>${ico}</span> <span>${msg}</span>`;
        el.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(()=>el.classList.remove('show'), 3500);
    }

    function fmt(iso){
        if (!iso) return '';
        try{
            return new Date(iso).toLocaleDateString(
                arcLang === 'ar' ? 'ar-EG' : 'en-GB',
                {year:'numeric',month:'short',day:'numeric'});
        }catch(e){ return String(iso).slice(0,10); }
    }

    /* ══ حالة الفلاتر والصفحات ══ */
    const PAGE_SIZE = 20;
    const state = { sort:'newest', country:'all', mood:'all', lang:'all', offset:0, done:false, loading:false, total:null };
    let dateColumnOk = true; /* في حال عدم وجود created_at نستخدم arrival_at كبديل تلقائيًا */

    function orderColumn(){
        if (state.sort === 'mostread') return { col:'reads_count', asc:false };
        const col = dateColumnOk ? 'created_at' : 'arrival_at';
        return { col, asc: state.sort === 'oldest' };
    }

    function buildQuery(withCount){
        let q = sb.from('capsules').select(
            'id,text,author,country,mood,arrival_at,created_at,lang,reads_count',
            withCount ? { count: 'exact' } : undefined
        );
        if (state.country !== 'all') q = q.eq('country', state.country);
        if (state.mood !== 'all')    q = q.eq('mood', state.mood);
        if (state.lang !== 'all')    q = q.eq('lang', state.lang);
        const ord = orderColumn();
        q = q.order(ord.col, { ascending: ord.asc });
        q = q.range(state.offset, state.offset + PAGE_SIZE - 1);
        return q;
    }

    function cardHtml(c){
        const mood = c.mood || 'hope';
        const isAr = (c.lang || 'ar') === 'ar';
        const transUrl = `https://translate.google.com/?sl=auto&tl=${arcLang}&text=${encodeURIComponent(c.text||'')}&op=translate`;
        const li = document.createElement('li');
        const el = document.createElement('article');
        el.className = 'arc-card';
        el.style.setProperty('--mc', MOOD_COLOR[mood] || '#8b5cf6');
        el.dataset.id = c.id;
        el.innerHTML = `
            <div class="arc-top">
                <span class="arc-mood">${MOOD_ICO[mood]||'✨'} <span class="mood-label">${(MOOD_LABELS[arcLang]||MOOD_LABELS.ar)[mood]||mood}</span></span>
                <span class="arc-lang-badge">${isAr?'AR':'EN'}</span>
                <span class="arc-date">${fmt(c.created_at||c.arrival_at)}</span>
            </div>
            <p class="arc-text" dir="auto">"${escapeHtml(c.text)}"</p>
            <div class="arc-bottom">
                <span>📍 <span class="country-label">${countryLabel(c.country)}</span></span>
                <span><span class="by-label">${T('by')}</span>: <b>${escapeHtml(c.author||T('anon'))}</b></span>
                <span>👁️ <b>${c.reads_count ?? 0}</b> <span class="reads-label">${T('reads')}</span></span>
            </div>
            <div class="arc-actions">
                <a class="arc-btn translate-btn" href="${transUrl}" target="_blank" rel="noopener">🔤 <span class="tr-label">${T('translate')}</span></a>
                <button class="arc-btn report-btn" data-id="${c.id}" type="button">🚩 <span class="rp-label">${T('report')}</span></button>
            </div>`;
        el.dataset.mood = mood;
        el.dataset.country = c.country || '';
        el.querySelector('.report-btn').addEventListener('click', onReport);
        li.appendChild(el);
        return li;
    }

    async function onReport(e){
        const btn = e.currentTarget;
        const id = parseInt(btn.dataset.id, 10);
        btn.disabled = true;
        const original = btn.innerHTML;
        btn.innerHTML = '…';
        if (!sb){ toast(T('dbNeeded'), '⚠️'); btn.disabled = false; btn.innerHTML = original; return; }
        try{
            const { error } = await sb.rpc('report_capsule', { p_id: id, p_reason: 'user_report' });
            if (error){
                toast(T('reportFail'), '⚠️');
                btn.innerHTML = original; btn.disabled = false;
            } else {
                btn.innerHTML = '✓';
                toast(T('reportOk'), '🚩');
            }
        }catch(e2){
            toast(T('fail'), '⚠️');
            btn.innerHTML = original; btn.disabled = false;
        }
    }

    function renderSkeletons(n){
        const list = $('archiveList');
        for (let i=0;i<n;i++){
            const li = document.createElement('li');
            li.className = 'skel-item';
            li.innerHTML = '<div class="skel"></div>';
            list.appendChild(li);
        }
    }
    function clearSkeletons(){
        document.querySelectorAll('#archiveList .skel-item').forEach(n=>n.remove());
    }

    function updateResultCount(){
        const el = $('resultCount');
        if (state.total == null){ el.textContent = ''; return; }
        el.textContent = arcLang === 'ar' ? `🛰️ ${state.total} كبسولة مطابقة` : `🛰️ ${state.total} matching capsules`;
    }

    async function fetchPage(reset){
        if (state.loading) return;
        if (!reset && state.done) return;
        state.loading = true;
        $('loadMoreBtn').disabled = true;
        if (reset){
            state.offset = 0; state.done = false; state.total = null;
            $('archiveList').innerHTML = '';
            $('emptyState').style.display = 'none';
        }
        renderSkeletons(reset ? 6 : 3);

        if (!sb){
            clearSkeletons();
            $('emptyState').style.display = 'block';
            $('loadMoreBtn').style.display = 'none';
            state.loading = false;
            return;
        }

        try{
            let { data, error, count } = await buildQuery(reset);
            if (error && dateColumnOk && orderColumn().col === 'created_at'){
                /* بديل تلقائي في حال لم يوجد عمود created_at في الجدول */
                dateColumnOk = false;
                ({ data, error, count } = await buildQuery(reset));
            }
            clearSkeletons();
            if (error){
                console.warn('archive fetch:', error.message);
                toast(T('fail'), '⚠️');
                state.loading = false;
                return;
            }
            if (reset && typeof count === 'number') state.total = count;
            updateResultCount();

            const list = $('archiveList');
            (data||[]).forEach(c => list.appendChild(cardHtml(c)));
            state.offset += (data||[]).length;
            state.done = !data || data.length < PAGE_SIZE;
            $('loadMoreBtn').style.display = state.done ? 'none' : 'inline-flex';

            if (reset && (!data || data.length === 0)) $('emptyState').style.display = 'block';
        } catch(e){
            clearSkeletons();
            toast(T('fail'), '⚠️');
        }
        state.loading = false;
        $('loadMoreBtn').disabled = false;
    }

    /* ══ التمرير اللانهائي ══ */
    const sentinelObserver = ('IntersectionObserver' in window) ? new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) fetchPage(false);
    }, { rootMargin: '400px' }) : null;
    if (sentinelObserver) sentinelObserver.observe($('loadSentinel'));

    $('loadMoreBtn').addEventListener('click', () => fetchPage(false));

    /* ══ الفلاتر ══ */
    function wireChipGroup(containerId, dataAttr, stateKey){
        const group = $(containerId);
        group.addEventListener('click', e => {
            const btn = e.target.closest('.filter-chip');
            if (!btn) return;
            group.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
            btn.classList.add('active');
            state[stateKey] = btn.dataset[dataAttr];
            fetchPage(true);
        });
    }
    wireChipGroup('moodChips', 'mood', 'mood');
    wireChipGroup('langChips', 'lang', 'lang');

    $('sortSelect').addEventListener('change', e => { state.sort = e.target.value; fetchPage(true); });
    $('countrySelect').addEventListener('change', e => { state.country = e.target.value; fetchPage(true); });

    function populateCountries(){
        const sel = $('countrySelect');
        Object.keys(COUNTRY_INFO).forEach(code => {
            if (code === 'OTHER') return;
            sel.add(new Option(countryLabel(code), code));
        });
        sel.add(new Option(countryLabel('OTHER'), 'OTHER'));
    }
    populateCountries();

    /* ══ لغة الواجهة (منفصلة عن فلتر لغة الرسالة) ══ */
    const ARC_LANGS = {
        ar:{ toggle:'EN', back:'العودة للكوكب', mine:'كبسولاتي', title:'🗂️ أرشيف الكبسولات',
             subtitle:'رسائل هبطت من 48 دولة حول العالم — تصفّحها وصفّها كما تشاء',
             sort:'الترتيب', newest:'الأحدث أولاً', oldest:'الأقدم أولاً', mostread:'الأكثر قراءة',
             country:'الدولة', allCountries:'كل الدول', mood:'الشعور', all:'الكل',
             msgLang:'لغة الرسالة', langAll:'الكل', emptyText:'لا توجد كبسولات مطابقة لهذا الفلتر بعد… جرّب فلترًا آخر',
             loadMore:'تحميل المزيد ⤵' },
        en:{ toggle:'عربي', back:'← Back to Planet', mine:'My Capsules', title:'🗂️ Capsule Archive',
             subtitle:'Messages landed from 48 countries around the world — browse and sort them freely',
             sort:'Sort', newest:'Newest first', oldest:'Oldest first', mostread:'Most read',
             country:'Country', allCountries:'All countries', mood:'Mood', all:'All',
             msgLang:'Message language', langAll:'All', emptyText:'No capsules match this filter yet… try another one',
             loadMore:'Load more ⤵' }
    };

    const MOOD_CHIP_KEYS = ['hope','nostalgia','secret','confession','bold'];

    function applyArcLang(l){
        arcLang = l;
        const D = ARC_LANGS[l] || ARC_LANGS.ar;
        document.documentElement.lang = l;
        document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
        $('capLangToggle').textContent = D.toggle;
        $('backLinkText').textContent = D.back;
        $('myCapsulesText').textContent = D.mine;
        $('pageTitle').textContent = D.title;
        $('pageSubtitle').textContent = D.subtitle;
        $('sortLabel').textContent = D.sort;
        $('optNewest').textContent = D.newest;
        $('optOldest').textContent = D.oldest;
        $('optMostRead').textContent = D.mostread;
        $('countryLabel').textContent = D.country;
        $('optAllCountries').textContent = D.allCountries;
        $('moodLabel').textContent = D.mood;
        $('moodAllText').textContent = D.all;
        $('msgLangLabel').textContent = D.msgLang;
        $('langAllText').textContent = D.langAll;
        $('emptyText').textContent = D.emptyText;
        $('loadMoreBtn').textContent = D.loadMore;
        MOOD_CHIP_KEYS.forEach(k => {
            const el = document.querySelector(`#moodChips [data-mood="${k}"] [data-i18n]`);
            if (el) el.textContent = (MOOD_LABELS[l]||MOOD_LABELS.ar)[k];
        });

        /* تحديث النصوص داخل البطاقات المعروضة بالفعل دون إعادة تحميلها */
        document.querySelectorAll('.arc-card').forEach(card=>{
            const moodLabel = card.querySelector('.mood-label');
            if (moodLabel && card.dataset.mood) moodLabel.textContent = (MOOD_LABELS[l]||MOOD_LABELS.ar)[card.dataset.mood] || card.dataset.mood;
            const countryEl = card.querySelector('.country-label');
            if (countryEl && card.dataset.country) countryEl.textContent = countryLabel(card.dataset.country);
            const byEl = card.querySelector('.by-label');
            if (byEl) byEl.textContent = T('by');
            const readsEl = card.querySelector('.reads-label');
            if (readsEl) readsEl.textContent = T('reads');
            const trLabel = card.querySelector('.tr-label');
            if (trLabel) trLabel.textContent = T('translate');
            const rpLabel = card.querySelector('.rp-label');
            if (rpLabel && rpLabel.closest('button') && !rpLabel.closest('button').disabled) rpLabel.textContent = T('report');
            const trLink = card.querySelector('.translate-btn');
            if (trLink){
                try{
                    const u = new URL(trLink.href);
                    u.searchParams.set('tl', l);
                    trLink.href = u.toString();
                }catch(e){}
            }
        });

        /* إعادة بناء قائمة الدول بأسمائها المترجمة */
        const curCountry = $('countrySelect').value;
        $('countrySelect').innerHTML = '';
        $('countrySelect').add(new Option(D.allCountries, 'all'));
        populateCountries();
        $('countrySelect').value = curCountry || 'all';
    }

    $('capLangToggle').addEventListener('click', () => {
        const next = arcLang === 'ar' ? 'en' : 'ar';
        try{ localStorage.setItem('cc_lang', next); }catch(e){}
        applyArcLang(next);
    });

    applyArcLang(arcLang);
    fetchPage(true);
})();
</script>
</body>
</html>
