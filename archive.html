        <p class="page-subtitle" id="pageSubtitle">اقرأ آلاف الرسائل التي تسبح في الفضـاء...</p>

        <aside class="filter-bar">
            <select id="filterCountry" class="filter-select"><option value="">🌍 جميع الدول</option></select>

                <option value="">✨ كل المشاعر</option>
                <option value="hope">أمل (Hope)</option>
                <option value="nostalgia">حنين (Nostalgia)</option>
                <option value="secret">سر (Secret)</option>
                <option value="confession">اعتراف (Confession)</option>
                <option value="bold">جرأة (Bold)</option>
            </select>
            <select id="filterLang" class="filter-select">
                <option value="">🌐 كل اللغات</option>
                <option value="ar">العربية (AR)</option>
                <option value="en">English (EN)</option>
            </select>
            <select id="filterSort" class="filter-select">
                <option value="newest">⏳ الأحدث أولاً</option>
                <option value="oldest">🕰️ الأقدم أولاً</option>
                <option value="reads">👁️ الأكثر قراءة</option>
            </select>
        </aside>

        <section class="cap-list" id="archiveList"></section>
        <div id="loader" class="loader">جاري جلب الكبسولات...</div>

        <div style="text-align:center;">
            <button id="loadMoreBtn" class="load-more-btn" style="display:none;">تحميل المزيد</button>
