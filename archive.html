<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أرشيف الكوكب | Chronos Capsule</title>
    <meta name="description" content="استكشف كبسولات الزمن من جميع أنحاء العالم. أرشيف كبسولة الزمن الكونية يحوي آلاف الرسائل والاعترافات.">
    <!-- Hreflang & Favicon -->
    <link rel="alternate" hreflang="ar" href="/archive.html" />
    <link rel="alternate" hreflang="en" href="/archive.html?lang=en" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="archive.css">
</head>
<body>
    <header class="page-header">
        <a href="index.html" class="header-logo">
            <span class="header-logo-icon">🚀</span>
            <span class="header-logo-text">Chronos Capsule</span>
        </a>
        <div class="header-actions">
            <button id="langToggle" class="lang-toggle-cap">EN</button>
            <a href="index.html" class="back-link">
                <span id="backLinkText">العودة للكوكب</span>
            </a>
        </div>
    </header>

    <main class="page">
        <h1 class="page-title" id="pageTitle">أرشيف الكوكب</h1>
        <p class="page-subtitle" id="pageSubtitle">اقرأ آلاف الرسائل التي تسبح في الفضـاء...</p>
        
        <aside class="filter-bar">
            <!-- الفلاتر تعمل من سوبابيس (قاعدة البيانات) -->
            <select id="filterCountry" class="filter-select"><option value="">🌍 جميع الدول</option></select>
            <select id="filterMood" class="filter-select">
                <option value="">✨ كل المشاعر</option>
                <option value="hope">أمل (Hope)</option>
                <option value="nostalgia">حنين (Nostalgia)</option>
                <option value="secret">سر (Secret)</option>
                <option value="confession">اعتراف (Confession)</option>
                <option value="bold">جرأة (Bold)</option>
            </select>
            <select id="filterLang" class="filter-select">
                <option value="">🌐 كل اللغات</option>
                <option value="ar">العربية (AR)</option>
                <option value="en">English (EN)</option>
            </select>
            <select id="filterSort" class="filter-select">
                <option value="newest">⏳ الأحدث أولاً</option>
                <option value="oldest">🕰️ الأقدم أولاً</option>
                <option value="reads">👁️ الأكثر قراءة</option>
            </select>
        </aside>

        <section class="cap-list" id="archiveList"></section>
        <div id="loader" class="loader">جاري جلب الكبسولات...</div>
        
        <div style="text-align:center;">
            <button id="loadMoreBtn" class="load-more-btn" style="display:none;">تحميل المزيد</button>
        </div>
    </main>

    <!-- Supabase & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="archive.js"></script>
</body>
</html>
