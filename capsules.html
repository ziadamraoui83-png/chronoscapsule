<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كبسولتي | Chronos Capsule</title>
    <meta name="description" content="اعرض كبسولاتك الزمنية الخاصة وتابع مواعيد وصولها — كبسولة الزمن الكونية.">
    <meta name="theme-color" content="#010103">
    <meta name="robots" content="index, follow">

    <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icon-192.svg">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
        body{overflow-y:auto;background:#010103;color:#fff;min-height:100vh}
        button,a,select,input{cursor:pointer}
        body::before{content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse at 20% 50%,rgba(139,92,246,.08) 0%,transparent 60%),
                        radial-gradient(ellipse at 80% 20%,rgba(59,130,246,.06) 0%,transparent 50%),#010103;
            z-index:0;pointer-events:none}
        body::after{content:'';position:fixed;inset:0;
            background-image:radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.5) 0%,transparent 100%),
                radial-gradient(1px 1px at 25% 40%,rgba(255,255,255,.4) 0%,transparent 100%),
                radial-gradient(1px 1px at 50% 10%,rgba(255,255,255,.6) 0%,transparent 100%),
                radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.3) 0%,transparent 100%),
                radial-gradient(1px 1px at 90% 30%,rgba(255,255,255,.5) 0%,transparent 100%);
            z-index:0;pointer-events:none}
        .page-header{position:sticky;top:0;z-index:50;
            background:rgba(1,1,3,.85);backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,.07);
            padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .header-logo-icon{font-size:1.4rem}
        .header-logo-text{font-size:1.05rem;font-weight:900;
            background:linear-gradient(135deg,#a78bfa,#3b82f6);
            -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .header-actions{display:flex;align-items:center;gap:8px}
        .back-link{color:#a78bfa;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;
            padding:7px 14px;border:1px solid rgba(167,139,250,.3);border-radius:10px;transition:all .3s}
        .back-link:hover{color:#fff;border-color:#8b5cf6;background:rgba(139,92,246,.1)}
        .lang-toggle-cap{background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;
            border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);transition:all .3s}
        .lang-toggle-cap:hover{border-color:#8b5cf6;color:#fff}
        .page{max-width:860px;margin:0 auto;padding:34px 20px 80px;min-height:calc(100vh - 56px);position:relative;z-index:1}
        .page-title{font-size:1.7rem;font-weight:900;color:#fff;margin-bottom:4px}
        .page-subtitle{font-size:.88rem;color:#64748b;margin-bottom:26px}
        .code-box{background:rgba(15,23,42,.6);border:1px solid rgba(139,92,246,.3);border-radius:16px;
            padding:18px 20px;margin-bottom:22px;backdrop-filter:blur(8px)}
        .code-box-title{font-size:14px;font-weight:700;color:#a78bfa;margin-bottom:12px;
            display:flex;align-items:center;gap:8px}
        .code-box-row{display:flex;gap:10px;flex-wrap:wrap}
        .code-box-row input{flex:1;min-width:0;padding:10px 14px;background:rgba(0,0,0,.3);
            border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;
            outline:none;font-family:monospace;letter-spacing:.1em;transition:border-color .3s}
        .code-box-row input:focus{border-color:#8b5cf6}
        .code-box-row input::placeholder{color:#64748b;letter-spacing:.05em}
        .code-box-row button{padding:10px 18px;background:linear-gradient(135deg,#6d28d9,#2563eb);
            border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;
            cursor:pointer;transition:transform .25s,box-shadow .25s;white-space:nowrap;
            display:inline-flex;align-items:center;gap:6px}
        .code-box-row button:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(99,102,241,.4)}
        .code-box-row button:active{transform:translateY(0)}
        .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
        .search-input{flex:1;min-width:180px;padding:10px 14px;background:rgba(15,23,42,.6);
            border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.9rem;outline:none;
            transition:border-color .3s;backdrop-filter:blur(8px)}
        .search-input:focus{border-color:#8b5cf6}
        .search-input::placeholder{color:#64748b}
        .filter-chips{display:flex;gap:7px;flex-wrap:wrap}
        .filter-chip{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;
            border:1px solid rgba(255,255,255,.15);background:rgba(15,23,42,.6);color:#94a3b8;transition:all .3s}
        .filter-chip:hover{border-color:#8b5cf6;color:#fff}
        .filter-chip.active{background:rgba(139,92,246,.25);border-color:#8b5cf6;color:#fff}

        /* ═══════════════════════════════════════════════════════════
           🎴 البطاقة — نفس تصميم archive.html
           ═══════════════════════════════════════════════════════════ */
        .capsule-list{display:flex;flex-direction:column;gap:16px}

        .cap-card {
            background: rgba(15,23,42,.6);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            padding: 22px;
            backdrop-filter: blur(8px);
            transition: all .3s ease;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border-inline-start-width: 4px;
            position: relative;
        }
        .cap-card:hover {
            background: rgba(15,23,42,.8);
            border-color: rgba(139,92,246,.4);
            transform: translateY(-2px);
        }

        /* ألوان المشاعر */
        .cap-card.mood-hope       { border-inline-start-color: #34d399 !important; }
        .cap-card.mood-nostalgia  { border-inline-start-color: #fbbf24 !important; }
        .cap-card.mood-secret     { border-inline-start-color: #8b5cf6 !important; }
        .cap-card.mood-confession { border-inline-start-color: #ef4444 !important; }
        .cap-card.mood-bold       { border-inline-start-color: #f97316 !important; }

        /* حالة الوصول — أخضر */
        .cap-card.arrived {
            border-inline-start-color: #34d399 !important;
        }

        /* الصف العلوي */
        .cap-card .cap-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .cap-card .cap-country {
            font-size: 14px;
            font-weight: 700;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cap-card .cap-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .05em;
        }
        .cap-card .cap-badge.arrived {
            background: rgba(16,185,129,.15);
            color: #34d399;
            border: 1px solid rgba(16,185,129,.3);
        }
        .cap-card .cap-badge.orbit {
            background: rgba(251,191,36,.15);
            color: #fbbf24;
            border: 1px solid rgba(251,191,36,.3);
        }

        /* النص */
        .cap-card .cap-text {
            font-size: 1.15rem;
            color: #f8fafc;
            line-height: 1.7;
            unicode-bidi: plaintext;
            font-weight: 500;
        }
        .cap-card .cap-text.locked {
            color: #64748b;
            font-style: italic;
            font-size: .9rem;
            background: rgba(251,191,36,.05);
            border: 1px dashed rgba(251,191,36,.2);
            border-radius: 10px;
            padding: 12px 14px;
        }

        /* بيانات */
        .cap-card .cap-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #94a3b8;
            flex-wrap: wrap;
            gap: 10px;
        }
        .cap-card .cap-author {
            color: #a78bfa;
            font-weight: 700;
        }
        .cap-card .cap-stats {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .cap-card .cap-stats b {
            color: #a78bfa;
            direction: ltr;
            display: inline-block;
        }

        /* العد التنازلي */
        .cap-card .cap-countdown {
            font-size: 13px;
            color: #fbbf24;
            direction: ltr;
            font-family: monospace;
            background: rgba(251,191,36,.06);
            border-radius: 8px;
            padding: 6px 10px;
            display: inline-block;
            align-self: flex-start;
        }
        .cap-card .cap-countdown.done-label {
            color: #34d399;
            background: rgba(52,211,153,.06);
        }

        /* الأزرار */
        .cap-card .cap-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .cap-card .btn-share,
        .cap-card .btn-copy-code {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all .3s;
        }
        .cap-card .btn-share {
            background: rgba(59,130,246,.1);
            border: 1px solid rgba(59,130,246,.3);
            color: #60a5fa;
        }
        .cap-card .btn-share:hover {
            background: rgba(59,130,246,.25);
            color: #fff;
        }
        .cap-card .btn-copy-code {
            background: rgba(139,92,246,.1);
            border: 1px solid rgba(139,92,246,.3);
            color: #a78bfa;
        }
        .cap-card .btn-copy-code:hover {
            background: rgba(139,92,246,.25);
            color: #fff;
        }
        .cap-card .btn-delete {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            font-family: inherit;
            background: rgba(239,68,68,.08);
            border: 1px solid rgba(239,68,68,.3);
            color: #f87171;
            transition: all .3s;
            margin-inline-start: auto;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .cap-card .btn-delete:hover {
            background: rgba(239,68,68,.25);
            color: #fff;
            border-color: #ef4444;
        }
        .cap-card .btn-delete:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        .cap-card .btn-delete.confirming {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        /* صف السوشيال */
        .cap-card .social-row {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255,255,255,.08);
            flex-wrap: wrap;
            align-items: center;
        }
        .cap-card .social-label {
            font-size: 11px;
            color: #64748b;
            margin-inline-end: 4px;
        }
        .cap-card .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-decoration: none;
            font-size: 15px;
            transition: all .25s ease;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
        }
        .cap-card .social-btn.whatsapp { background: rgba(37,211,102,.12); color: #25d366; border-color: rgba(37,211,102,.3); }
        .cap-card .social-btn.whatsapp:hover { background: #25d366; color: #fff; transform: translateY(-2px); }
        .cap-card .social-btn.twitter { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.2); }
        .cap-card .social-btn.twitter:hover { background: #000; color: #fff; transform: translateY(-2px); }
        .cap-card .social-btn.facebook { background: rgba(24,119,242,.12); color: #1877f2; border-color: rgba(24,119,242,.3); }
        .cap-card .social-btn.facebook:hover { background: #1877f2; color: #fff; transform: translateY(-2px); }
        .cap-card .social-btn.telegram { background: rgba(0,136,204,.12); color: #0088cc; border-color: rgba(0,136,204,.3); }
        .cap-card .social-btn.telegram:hover { background: #0088cc; color: #fff; transform: translateY(-2px); }
        .cap-card .social-btn.copy-link { background: rgba(139,92,246,.12); color: #a78bfa; border-color: rgba(139,92,246,.3); }
        .cap-card .social-btn.copy-link:hover { background: #8b5cf6; color: #fff; transform: translateY(-2px); }

        /* زر إنشاء البطاقة */
        .cap-card .card-actions-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .cap-card .btn-create-card {
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            font-family: inherit;
            background: linear-gradient(135deg, rgba(139,92,246,.15), rgba(59,130,246,.15));
            border: 1px solid rgba(139,92,246,.4);
            color: #c4b5fd;
            cursor: pointer;
            transition: all .3s ease;
        }
        .cap-card .btn-create-card:hover {
            background: linear-gradient(135deg, #6d28d9, #2563eb);
            color: #fff;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99,102,241,.4);
        }

        /* زر الترجمة */
        .cap-card .action-btn {
            background: none;
            border: 1px solid rgba(255,255,255,.2);
            color: #94a3b8;
            border-radius: 7px;
            width: 26px;
            height: 24px;
            font-size: 13px;
            cursor: pointer;
            margin-inline-start: 6px;
            transition: all .25s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }
        .cap-card .translate-btn {
            border-color: rgba(56,189,248,.35);
            color: #7dd3fc;
        }
        .cap-card .translate-btn:hover {
            background: rgba(56,189,248,.15);
            border-color: #38bdf8;
            color: #fff;
        }

        /* حركات */
        @keyframes cardFadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(.9) translateX(-30px); }
        }
        .cap-card.deleting {
            animation: cardFadeOut .4s ease forwards;
        }
        @keyframes capsuleArrive {
            0% { transform: scale(.85) translateY(-20px); opacity: 0; }
            60% { transform: scale(1.03) translateY(4px); opacity: 1; }
            80% { transform: scale(.98) translateY(-2px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .cap-card.just-arrived {
            animation: capsuleArrive .7s cubic-bezier(.34,1.56,.64,1) forwards;
        }

        .hint{font-size:12px;color:#64748b;margin-top:12px;line-height:1.6}

        /* الإشعار */
        .cc-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
            background:rgba(15,23,42,.95);border:1px solid rgba(139,92,246,.4);border-radius:14px;
            padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:14px;
            backdrop-filter:blur(16px);z-index:9999;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);
            pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
        .cc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

        /* نافذة البطاقة (Card Generator Modal) */
        .card-modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0;
            transition: opacity .3s ease;
            padding: 20px; overflow-y: auto;
        }
        .card-modal-overlay.active { opacity: 1; }
        .card-modal {
            background: #0f172a;
            border: 1px solid rgba(139,92,246,.3);
            border-radius: 24px;
            max-width: 560px; width: 100%;
            padding: 24px; position: relative;
            box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 60px rgba(139,92,246,.15);
            transform: scale(.9);
            transition: transform .4s cubic-bezier(.34,1.56,.64,1);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .card-modal-overlay.active .card-modal { transform: scale(1); }
        .card-modal-close {
            position: absolute; top: 14px; left: 14px;
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.15);
            color: #94a3b8; font-size: 20px; cursor: pointer;
            transition: all .25s ease;
            display: flex; align-items: center; justify-content: center;
            padding: 0; line-height: 1;
        }
        .card-modal-close:hover { background: rgba(239,68,68,.2); color: #f87171; border-color: #ef4444; }
        .card-modal-head { text-align: center; margin-bottom: 18px; }
        .card-modal-title { display: block; font-size: 17px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .card-modal-sub { font-size: 12px; color: #64748b; }
        .card-modal-preview {
            background: #010103; border-radius: 16px;
            overflow: hidden; margin-bottom: 18px;
            aspect-ratio: 4 / 5;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,.08);
        }
        .card-modal-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .card-loading { display: flex; flex-direction: column; align-items: center; gap: 14px; color: #64748b; font-size: 13px; }
        .card-spinner {
            width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid rgba(139,92,246,.2);
            border-top-color: #8b5cf6;
            animation: cardSpin 1s linear infinite;
        }
        @keyframes cardSpin { to { transform: rotate(360deg); } }
        .card-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
        .card-btn {
            flex: 1; min-width: 100px; padding: 12px 16px;
            border-radius: 12px; font-size: 13.5px; font-weight: 700;
            font-family: inherit; cursor: pointer;
            transition: all .25s ease;
            border: 1px solid transparent;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .card-btn.primary { background: linear-gradient(135deg, #6d28d9, #2563eb); color: #fff; }
        .card-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(99,102,241,.4); }
        .card-btn.native { background: rgba(56,189,248,.12); color: #7dd3fc; border-color: rgba(56,189,248,.35); }
        .card-btn.native:hover { background: rgba(56,189,248,.25); color: #fff; transform: translateY(-2px); }
        .card-btn.copy { background: rgba(139,92,246,.12); color: #c4b5fd; border-color: rgba(139,92,246,.35); }
        .card-btn.copy:hover { background: rgba(139,92,246,.25); color: #fff; transform: translateY(-2px); }
        .card-social-row {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            padding-top: 12px; border-top: 1px dashed rgba(255,255,255,.08);
        }
        .card-social-label { font-size: 11.5px; color: #64748b; margin-inline-end: 4px; }
        .card-social-btn {
            display: inline-flex; align-items: center; justify-content: center;
            width: 38px; height: 38px; border-radius: 50%;
            text-decoration: none; font-size: 16px;
            transition: all .25s ease;
            border: 1px solid transparent; cursor: pointer;
        }
        .card-social-btn.wa { background: rgba(37,211,102,.12); color: #25d366; border-color: rgba(37,211,102,.3); }
        .card-social-btn.wa:hover { background: #25d366; color: #fff; transform: translateY(-2px); }
        .card-social-btn.tw { background: rgba(255,255,255,.08); color: #fff; border-color: rgba(255,255,255,.2); }
        .card-social-btn.tw:hover { background: #000; color: #fff; transform: translateY(-2px); }
        .card-social-btn.fb { background: rgba(24,119,242,.12); color: #1877f2; border-color: rgba(24,119,242,.3); }
        .card-social-btn.fb:hover { background: #1877f2; color: #fff; transform: translateY(-2px); }
        .card-social-btn.tg { background: rgba(0,136,204,.12); color: #0088cc; border-color: rgba(0,136,204,.3); }
        .card-social-btn.tg:hover { background: #0088cc; color: #fff; transform: translateY(-2px); }

        /* Skeleton */
        .skeleton-list{display:flex;flex-direction:column;gap:16px}
        .skeleton-item{
            background:rgba(15,23,42,.5);
            border:1px solid rgba(255,255,255,.06);
            border-radius:18px;
            padding:22px;
            display:flex;flex-direction:column;gap:14px;
            border-inline-start-width:4px;
            border-inline-start-color:rgba(139,92,246,.25);
            overflow:hidden;
            position:relative;
        }
        .skeleton-item::after{
            content:'';
            position:absolute;inset:0;
            background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.04) 40%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 60%, transparent 100%);
            animation:skeletonShimmer 1.6s ease-in-out infinite;
            pointer-events:none;
        }
        @keyframes skeletonShimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
        html[dir="rtl"] .skeleton-item::after{animation:skeletonShimmerRTL 1.6s ease-in-out infinite}
        @keyframes skeletonShimmerRTL{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
        .skeleton-head{display:flex;justify-content:space-between;align-items:center;gap:15px}
        .skeleton-line{
            height:14px;border-radius:8px;
            background:linear-gradient(90deg,rgba(139,92,246,.10),rgba(139,92,246,.18),rgba(139,92,246,.10));
            position:relative;overflow:hidden;
        }
        .skeleton-line::after{
            content:'';position:absolute;inset:0;
            background:linear-gradient(90deg,transparent 0%,rgba(167,139,250,.15) 50%,transparent 100%);
            animation:skeletonPulse 1.8s ease-in-out infinite;
        }
        @keyframes skeletonPulse{0%,100%{opacity:.4}50%{opacity:1}}
        .skeleton-line.badge{width:90px;height:24px;border-radius:20px}
        .skeleton-line.title{width:60%;height:20px}
        .skeleton-line.text-1{width:100%}
        .skeleton-line.text-2{width:92%}
        .skeleton-line.text-3{width:70%}
        .skeleton-line.meta{width:40%;height:12px}
        .skeleton-line.short{width:30%;height:12px}
        .skeleton-lines-group{display:flex;flex-direction:column;gap:10px}

        /* Empty State */
        .empty-state{text-align:center;padding:60px 30px 80px;max-width:520px;margin:0 auto;position:relative;z-index:1}
        .empty-state::before{content:'';position:absolute;top:40px;left:50%;transform:translateX(-50%);width:260px;height:260px;background:radial-gradient(circle,rgba(139,92,246,.18) 0%,transparent 70%);pointer-events:none;z-index:-1;animation:emptyGlow 5s ease-in-out infinite}
        @keyframes emptyGlow{0%,100%{opacity:.5;transform:translateX(-50%) scale(1)}50%{opacity:.9;transform:translateX(-50%) scale(1.15)}}
        .empty-state-icon{font-size:76px;margin-bottom:24px;display:inline-block;filter:drop-shadow(0 0 30px rgba(139,92,246,.5));animation:emptyFloat 4s ease-in-out infinite}
        @keyframes emptyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
        .empty-state-title{font-size:1.6rem;font-weight:900;margin-bottom:14px;line-height:1.3;background:linear-gradient(135deg,#a78bfa,#3b82f6,#3AE1FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .empty-state-desc{font-size:.95rem;color:#94a3b8;line-height:1.8;margin-bottom:28px;max-width:400px;margin-inline:auto}
        .empty-state-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
        .empty-state-cta{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;background:linear-gradient(135deg,#6d28d9,#2563eb);color:#fff;text-decoration:none;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .3s ease;box-shadow:0 8px 24px rgba(99,102,241,.35)}
        .empty-state-cta:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(99,102,241,.5)}
        .empty-state-hint{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;color:#a78bfa;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2);border-radius:14px;padding:12px 18px;line-height:1.7;text-align:start;max-width:440px;margin-top:8px}
        .empty-state-hint-icon{font-size:18px;flex:none;filter:drop-shadow(0 0 8px rgba(167,139,250,.5))}

        @media(max-width:600px){
            .page-header{padding:12px 16px}
            .page{padding:24px 14px 60px}
            .page-title{font-size:1.4rem}
            .filter-bar{flex-direction:column;align-items:stretch}
            .search-input{width:100%}
            .cap-card { padding: 18px; }
            .cap-card .cap-text { font-size: 1.05rem; }
            .skeleton-item { padding: 18px; }
            .card-modal { padding: 20px; border-radius: 20px; }
            .card-modal-close { top: 10px; left: 10px; width: 32px; height: 32px; font-size: 18px; }
            .card-btn { min-width: 80px; padding: 11px 12px; font-size: 12.5px; }
            .card-social-btn { width: 34px; height: 34px; font-size: 14px; }
            .empty-state { padding: 50px 20px 60px; }
            .empty-state-icon { font-size: 60px; margin-bottom: 18px; }
            .empty-state-title { font-size: 1.3rem; }
            .empty-state-desc { font-size: .9rem; margin-bottom: 22px; }
            .empty-state-cta { padding: 11px 22px; font-size: 13px; }
            .empty-state-hint { font-size: 11.5px; padding: 10px 14px; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
            .cap-card:hover { transform: none; }
            .skeleton-item::after { animation: none; opacity: 0.3; }
            .skeleton-line::after { animation: none; opacity: 0.6; }
            .empty-state-icon { animation: none; }
            .empty-state::before { animation: none; }
        }
    </style>
</head>
<body>
<header class="page-header">
    <a href="index.html" class="header-logo">
        <span class="header-logo-icon">🚀</span>
        <span class="header-logo-text">CHRONOS CAPSULE</span>
    </a>
    <div class="header-actions">
        <button class="lang-toggle-cap" id="capLangToggle">EN</button>
        <a href="index.html" class="back-link">
            <span>←</span>
            <span id="backLinkText">العودة للكوكب</span>
        </a>
    </div>
</header>

<div class="cc-toast" id="capToast"><span class="ico">🚀</span><span class="txt"></span></div>

<main class="page">
    <h1 class="page-title" id="pageTitle">🛸 كبسولاتي</h1>
    <p class="page-subtitle" id="pageSubtitle">جميع الكبسولات المرتبطة بجهازك أو حسابك</p>

    <div class="code-box">
        <div class="code-box-title">🔑 <span id="codeBoxTitle">افتح كبسولة بالمفتاح السري</span></div>
        <div class="code-box-row">
            <input type="text" id="codeInput" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
            <button id="openCodeBtn" type="button">🔓 <span id="openBtnText">فتح</span></button>
        </div>
        <p class="hint" id="codeHint">أدخل مفتاح الكبسولة الذي وصلك — يعمل حتى قبل موعد الوصول</p>
    </div>

    <div class="filter-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث في كبسولاتك...">
        <div class="filter-chips" id="filterChips">
            <button class="filter-chip active" data-filter="all">الكل</button>
            <button class="filter-chip" data-filter="arrived">✅ وصلت</button>
            <button class="filter-chip" data-filter="orbit">🛰️ في المدار</button>
        </div>
    </div>

    <div class="capsule-list" id="capList"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="card-generator.js"></script>
<script src="i18n.js"></script>
<script src="likes.js"></script>
<script src="ratings.js"></script>
<script>
(function(){
    "use strict";

    const cfg = window.CC_CONFIG || { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };
    const sb = (cfg.SUPABASE_URL && window.supabase)
        ? supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

    const $ = id => document.getElementById(id);

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));

    function trackEvent(eventName, params = {}) {
        try { if (typeof gtag === 'function') gtag('event', eventName, params); } catch (e) {}
    }

    const MOOD_ICO = {hope:'💙', nostalgia:'💜', secret:'💚', confession:'💛', bold:'❤️'};

    let capLang = (() => { try { return localStorage.getItem('cc_lang') || 'ar'; } catch (e) { return 'ar'; } })();
    try {
        const urlLang = new URLSearchParams(location.search).get('lang');
        if (urlLang === 'ar' || urlLang === 'en') capLang = urlLang;
    } catch (e) {}

    let currentUserId = null;

    let _toastTimer;
    function toast(msg, ico = '🚀'){
        const el = $('capToast');
        if (!el) return;
        el.querySelector('.ico').textContent = ico;
        el.querySelector('.txt').textContent = msg;
        el.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
    }

    function fmt(iso){
        if (!iso) return '';
        try {
            return new Date(iso).toLocaleDateString(
                capLang === 'ar' ? 'ar-DZ' : 'en-GB',
                { year:'numeric', month:'long', day:'numeric' });
        } catch (e) { return String(iso).slice(0, 10); }
    }

    function countdownShort(iso){
        const diff = new Date(iso) - Date.now();
        if (diff <= 0) return null;
        const d = Math.floor(diff / 864e5);
        const h = Math.floor((diff % 864e5) / 36e5);
        const m = Math.floor((diff % 36e5) / 6e4);
        if (d > 0) return `${d}d ${h}h ${m}m`;
        return `${h}h ${m}m`;
    }

    function getCountryFlag(code) {
        return /^[A-Z]{2}$/.test(code)
            ? code.replace(/./g, ch => String.fromCodePoint(127397 + ch.charCodeAt(0)))
            : '🌍';
    }

    let allCards = [];
    let activeFilter = 'all';
    let searchQ = '';

    function applyFilters(){
        let visible = 0;
        allCards.forEach(({el, arrived, text}) => {
            const matchFilter = activeFilter === 'all'
                || (activeFilter === 'arrived' && arrived)
                || (activeFilter === 'orbit' && !arrived);
            const matchSearch = !searchQ || text.toLowerCase().includes(searchQ.toLowerCase());
            const show = matchFilter && matchSearch;
            el.style.display = show ? '' : 'none';
            if (show) visible++;
        });

        const list = $('capList');
        if (allCards.length === 0) {
            if (!list.querySelector('.empty-state')) {
                list.innerHTML = getEmptyStateHTML('no-capsules');
            }
            return;
        }
        if (visible === 0) {
            if (!list.querySelector('.empty-state')) {
                list.insertAdjacentHTML('beforeend', getEmptyStateHTML('no-results'));
            }
        } else {
            list.querySelector('.empty-state')?.remove();
        }
    }

    /* Skeleton */
    function getSkeletonHTML() {
        const label = capLang === 'ar' ? 'جاري التحميل...' : 'Loading...';
        const item = `
            <div class="skeleton-item" aria-hidden="true">
                <div class="skeleton-head">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line badge"></div>
                </div>
                <div class="skeleton-lines-group">
                    <div class="skeleton-line text-1"></div>
                    <div class="skeleton-line text-2"></div>
                    <div class="skeleton-line text-3"></div>
                </div>
                <div class="skeleton-head">
                    <div class="skeleton-line meta"></div>
                    <div class="skeleton-line short"></div>
                </div>
            </div>`;
        return `
            <div class="skeleton-list" role="status" aria-label="${label}">
                ${item.repeat(3)}
            </div>`;
    }

    /* Empty State */
    function getEmptyStateHTML(type) {
        const isAr = capLang === 'ar';
        const config = {
            'no-results': {
                icon: '🔍',
                title: isAr ? 'لا توجد نتائج' : 'No Results Found',
                desc: isAr
                    ? 'لم يُعثر على أي كبسولة تطابق البحث أو الفلتر. جرّب كلمة أخرى أو غيّر الفلتر.'
                    : 'No capsules match your search or filter. Try another keyword or change the filter.',
                hint: isAr ? 'نصيحة: ابحث بجزء من النص فقط، أو اعرض "الكل"' : 'Tip: Search with a partial text, or show "All"'
            },
            'no-capsules': {
                icon: '🛸',
                title: isAr ? 'لم تُطلق كبسولة بعد' : 'No Capsules Yet',
                desc: isAr
                    ? 'الفضاء ينتظر رسالتك. ابدأ رحلتك عبر الزمن الآن — اكتب كبسولة، واختر متى تصل.'
                    : 'Space awaits your message. Start your time travel now — write a capsule and choose when it arrives.',
                cta: {
                    href: 'index.html',
                    label: isAr ? '🚀 إطلاق أول كبسولة' : '🚀 Launch First Capsule'
                },
                hint: isAr ? 'كل كبسولة تبقى في الفضاء حتى موعدها — ستحصل على مفتاح سري لمتابعتها' : 'Every capsule stays in space until its time — you\'ll get a secret key to track it'
            },
            'error': {
                icon: '⚠️',
                title: isAr ? 'حدث خطأ' : 'Something Went Wrong',
                desc: isAr
                    ? 'تعذّر تحميل كبسولاتك من الفضاء. تحقق من اتصالك وحاول مجددًا.'
                    : 'Failed to load your capsules from space. Check your connection and try again.',
                cta: {
                    href: 'javascript:location.reload()',
                    label: isAr ? '🔄 حاول مجددًا' : '🔄 Try Again'
                },
                hint: null
            }
        };
        const c = config[type] || config['no-results'];
        const ctaHTML = c.cta ? `<div class="empty-state-actions"><a href="${c.cta.href}" class="empty-state-cta">${c.cta.label}</a></div>` : '';
        const hintHTML = c.hint ? `<div class="empty-state-hint"><span class="empty-state-hint-icon">💡</span><span>${c.hint}</span></div>` : '';

        return `
            <div class="empty-state" role="status">
                <div class="empty-state-icon">${c.icon}</div>
                <h2 class="empty-state-title">${c.title}</h2>
                <p class="empty-state-desc">${c.desc}</p>
                ${ctaHTML}
                ${hintHTML}
            </div>`;
    }

    function buildSocialRow(code, text) {
        const url = `${location.origin}${location.pathname}?capsule=${encodeURIComponent(code)}`;
        const shortText = text.slice(0, 100);
        const waText = encodeURIComponent(`${shortText}\n${url}`);
        const twText = encodeURIComponent(shortText);
        const twUrl  = encodeURIComponent(url);
        const fbUrl  = encodeURIComponent(url);
        const tgUrl  = encodeURIComponent(url);
        const tgText = encodeURIComponent(shortText);
        const label = capLang === 'ar' ? 'شارك على:' : 'Share on:';

        return `
            <div class="social-row">
                <span class="social-label">${label}</span>
                <a href="https://wa.me/?text=${waText}" target="_blank" rel="noopener" class="social-btn whatsapp" title="WhatsApp" data-social="whatsapp">📱</a>
                <a href="https://twitter.com/intent/tweet?text=${twText}&url=${twUrl}" target="_blank" rel="noopener" class="social-btn twitter" title="X / Twitter" data-social="twitter">𝕏</a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${fbUrl}" target="_blank" rel="noopener" class="social-btn facebook" title="Facebook" data-social="facebook">f</a>
                <a href="https://t.me/share/url?url=${tgUrl}&text=${tgText}" target="_blank" rel="noopener" class="social-btn telegram" title="Telegram" data-social="telegram">✈️</a>
                <button class="social-btn copy-link" title="${capLang === 'ar' ? 'نسخ الرابط' : 'Copy link'}" data-copy-url="${esc(url)}">🔗</button>
            </div>`;
    }

    function buildCardButton(c) {
        const codeVal = c.o_code || c.code || '';
        if (!codeVal) return '';
        const label = capLang === 'ar' ? '🎨 أنشئ بطاقة' : '🎨 Create Card';
        const dataAttrs = [
            `data-card-code="${esc(codeVal)}"`,
            `data-card-text="${esc((c.o_text || c.text || '').slice(0, 200))}"`,
            `data-card-author=""`,
            `data-card-country="${esc(c.o_country || '')}"`,
            `data-card-mood="${esc(c.o_mood || c.mood || 'hope')}"`,
            `data-card-arrival="${esc(c.arrival_at || '')}"`,
            `data-card-created="${esc(c.created_at || c.o_created || '')}"`,
            `data-card-reads="${c.o_reads != null ? c.o_reads : 0}"`
        ].join(' ');
        return `<div class="card-actions-row"><button class="btn-create-card" ${dataAttrs} type="button">${label}</button></div>`;
    }

    function shareCapsule(code, text){
        trackEvent('capsule_shared', { method: 'native', lang: capLang });
        const url = `${location.origin}${location.pathname}?capsule=${encodeURIComponent(code)}`;
        if (navigator.share){
            navigator.share({
                title: capLang === 'ar' ? 'كبسولة الزمن' : 'Chronos Capsule',
                text: text.slice(0, 80) + '…',
                url
            }).catch(() => {});
        } else {
            navigator.clipboard.writeText(url)
                .then(() => toast(capLang === 'ar' ? 'تم نسخ رابط الكبسولة!' : 'Capsule link copied!', '🔗'))
                .catch(() => toast(url, '🔗'));
        }
    }

    function copyCode(code){
        trackEvent('capsule_key_copied', { lang: capLang });
        navigator.clipboard.writeText(code)
            .then(() => toast(capLang === 'ar' ? 'تم نسخ المفتاح!' : 'Key copied!', '🔑'))
            .catch(() => toast(code, '🔑'));
    }

    function copyText(text, msg) {
        navigator.clipboard.writeText(text)
            .then(() => toast(msg, '🔗'))
            .catch(() => toast(text, '🔗'));
    }

    async function deleteCapsule(capId, cardEl) {
        if (!capId || !sb) return false;
        const deviceHash = localStorage.getItem('cc_device') || '';
        try {
            const { data, error } = await sb.rpc('delete_capsule', {
                p_id: capId,
                p_device_hash: deviceHash,
                p_user_id: currentUserId
            });
            if (error || !data) {
                toast(capLang === 'ar' ? 'تعذر حذف الكبسولة' : 'Failed to delete capsule', '⚠️');
                return false;
            }
            cardEl.classList.add('deleting');
            setTimeout(() => {
                cardEl.remove();
                allCards = allCards.filter(c => c.el !== cardEl);
                applyFilters();
            }, 400);
            toast(capLang === 'ar' ? 'تم حذف الكبسولة' : 'Capsule deleted', '🗑️');
            trackEvent('capsule_deleted', { lang: capLang });
            return true;
        } catch (e) {
            toast(capLang === 'ar' ? 'حدث خطأ' : 'Something went wrong', '⚠️');
            return false;
        }
    }

    /* ═══════════════════════════════════════════════════════════
       🎴 البطاقة — نفس تصميم archive.html
       ═══════════════════════════════════════════════════════════ */
    function card(c, animate){
        animate = !!animate;
        const arrivalISO = c.o_arrival_at || c.arrival_at;
        const createdISO = c.o_created || c.created_at;
        const arrived = !arrivalISO || new Date(arrivalISO) <= new Date();
        const rawText = (c.o_text || c.text || '');
        const isAr = capLang === 'ar';
        const el = document.createElement('article');
        const mood = c.o_mood || c.mood || 'hope';
        const countryCode = c.o_country || c.country || 'OTHER';
        const flag = getCountryFlag(countryCode);
        const moodEmoji = MOOD_ICO[mood] || '✨';

        el.className = `cap-card mood-${mood} ${arrived ? 'arrived' : 'in-orbit'}${animate ? ' just-arrived' : ''}`;

        const codeVal = c.o_code || c.code || '';
        const capId = c.o_id || c.id || null;
        const reads = c.o_reads != null ? c.o_reads : (c.reads != null ? c.reads : 0);
        const authorName = c.author || c.o_author || (isAr ? 'مجهول' : 'Anonymous');
        const whenText = fmt(arrivalISO || createdISO);

        const transUrl = `https://translate.google.com/?sl=auto&tl=${isAr ? 'ar' : 'en'}&text=${encodeURIComponent(rawText)}&op=translate`;
        const translateBtn = `<a href="${transUrl}" target="_blank" rel="noopener" class="action-btn translate-btn" data-translate title="${isAr ? 'ترجم' : 'Translate'}">🔤</a>`;

        const labels = isAr ? {
            copy: '🔑 نسخ المفتاح', share: '🔗 مشاركة', delete: 'حذف',
            reads: 'قراءة', arrived: '✅ وصلت', orbit: '🛰️ في المدار',
            locked: '🔒 الرسالة مقفلة حتى موعد الوصول',
            confirm: '⚠️ متأكد؟'
        } : {
            copy: '🔑 Copy key', share: '🔗 Share', delete: 'Delete',
            reads: 'reads', arrived: '✅ Arrived', orbit: '🛰️ In orbit',
            locked: '🔒 Message locked until arrival',
            confirm: '⚠️ Sure?'
        };

        const statusText = arrived ? labels.arrived : labels.orbit;
        const statusClass = arrived ? 'arrived' : 'orbit';

        const lockedHtml = !arrived
            ? `<div class="cap-text locked">${labels.locked}</div>`
            : `<div class="cap-text">${esc(rawText)}</div>`;

        const countdownText = !arrived && arrivalISO ? countdownShort(arrivalISO) : null;

        el.innerHTML = `
            <div class="cap-head">
                <div class="cap-country">${flag} ${esc(countryCode)} ${moodEmoji}</div>
                <div><span class="cap-badge ${statusClass}">${statusText}</span></div>
            </div>
            ${lockedHtml}
            <div class="cap-meta">
                <div class="cap-author">${isAr ? 'بقلم: ' : 'By: '}<b>${esc(authorName)}</b></div>
                <div class="cap-stats">
                    <span>📅 ${esc(whenText)}</span>
                    <span>👁️ <b>${reads}</b> ${labels.reads}</span>
                    ${translateBtn}
                </div>
            </div>
            ${countdownText ? `<div class="cap-countdown" data-arrival="${esc(arrivalISO)}">⏳ T-${esc(countdownText)}</div>` : ''}
            <div class="cap-actions">
                ${codeVal ? `<button class="btn-copy-code" data-code="${esc(codeVal)}">${labels.copy}</button>` : ''}
                ${arrived && codeVal ? `<button class="btn-share" data-code="${esc(codeVal)}" data-text="${esc(rawText.slice(0, 80))}">${labels.share}</button>` : ''}
                ${capId ? `<button class="btn-delete" data-delete-id="${capId}" type="button">🗑️ ${labels.delete}</button>` : ''}
            </div>
            ${arrived && codeVal ? buildSocialRow(codeVal, rawText) : ''}
            ${arrived ? buildCardButton(c) : ''}
        `;

        /* ربط الأزرار */
        el.querySelector('.btn-copy-code')?.addEventListener('click', () => copyCode(codeVal));
        el.querySelector('.btn-share')?.addEventListener('click', () => shareCapsule(codeVal, rawText));

        el.querySelectorAll('[data-social]').forEach(btn => {
            btn.addEventListener('click', () => {
                trackEvent('capsule_shared', { method: btn.dataset.social, lang: capLang });
            });
        });

        const copyBtn = el.querySelector('[data-copy-url]');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const url = copyBtn.dataset.copyUrl;
                copyText(url, capLang === 'ar' ? 'تم نسخ الرابط!' : 'Link copied!');
                trackEvent('capsule_link_copied', { lang: capLang });
            });
        }

        const cardBtn = el.querySelector('.btn-create-card');
        if (cardBtn) {
            cardBtn.addEventListener('click', () => {
                const opts = {
                    text: rawText,
                    author: authorName,
                    country: countryCode,
                    mood: mood,
                    arrivalAt: arrivalISO || null,
                    createdAt: createdISO || null,
                    reads: reads,
                    code: codeVal,
                    lang: capLang
                };
                if (window.CardGenerator && typeof window.CardGenerator.open === 'function') {
                    window.CardGenerator.open(opts);
                } else {
                    toast(isAr ? 'ميزة البطاقة غير جاهزة' : 'Card feature not ready', '⚠️');
                }
                trackEvent('card_generate_clicked', { mood: mood, lang: capLang });
            });
        }

        const deleteBtn = el.querySelector('.btn-delete');
        if (deleteBtn) {
            let confirmTimeout = null;
            deleteBtn.addEventListener('click', async () => {
                if (!deleteBtn.classList.contains('confirming')) {
                    deleteBtn.classList.add('confirming');
                    deleteBtn.dataset.original = deleteBtn.innerHTML;
                    deleteBtn.innerHTML = labels.confirm;
                    confirmTimeout = setTimeout(() => {
                        deleteBtn.classList.remove('confirming');
                        deleteBtn.innerHTML = deleteBtn.dataset.original;
                    }, 3000);
                    return;
                }
                clearTimeout(confirmTimeout);
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '⏳ ...';
                await deleteCapsule(capId, el);
            });
        }

        if (animate) setTimeout(() => el.classList.remove('just-arrived'), 1500);

        return {el, arrived, text: rawText};
    }

    /* Live countdown update */
    setInterval(() => {
        document.querySelectorAll('.cap-countdown[data-arrival]').forEach(el => {
            const cd = countdownShort(el.dataset.arrival);
            if (cd) el.textContent = `⏳ T-${cd}`;
            else { el.textContent = capLang === 'ar' ? '✅ وصلت للتو!' : '✅ Just arrived!'; el.className = 'cap-countdown done-label'; }
        });
    }, 1000);

    let _loadingMine = false;

    async function loadMine(){
        if (_loadingMine) return;
        _loadingMine = true;

        const list = $('capList');
        list.innerHTML = getSkeletonHTML();
        allCards = [];
        let items = [];

        if (sb) {
            try {
                const { data: sessionData } = await sb.auth.getSession();
                if (sessionData && sessionData.session && sessionData.session.user) {
                    currentUserId = sessionData.session.user.id;
                }
            } catch (e) {}
        }

        if (sb){
            const dev = localStorage.getItem('cc_device');
            try {
                const { data, error } = await sb.rpc('get_my_capsules', {
                    p_device_hash: dev || null,
                    p_user_id: currentUserId
                });
                if (!error && data) items = data;
            } catch (e) {}
        }

        if (!items.length){
            try {
                items = (JSON.parse(localStorage.getItem('chronos_capsules_v1')) || [])
                    .map(m => ({
                        o_text: m.text,
                        o_mood: m.mood,
                        o_country: m.country,
                        arrival_at: m.arrivalISO || null,
                        created_at: m.ts || new Date().toISOString(),
                        o_reads: 0
                    }));
            } catch (e) {}
        }

        list.innerHTML = '';

        if (!items.length){
            list.innerHTML = getEmptyStateHTML('no-capsules');
            _loadingMine = false;
            return;
        }

        items.sort((a, b) => new Date(b.o_created || b.created_at) - new Date(a.o_created || a.created_at));
        items.forEach(c => {
            const cardObj = card(c);
            allCards.push(cardObj);
            list.appendChild(cardObj.el);
        });
        applyFilters();

        _loadingMine = false;
    }

    async function openByCode(code){
        const trimmed = String(code || '').trim();
        if (!trimmed){ toast(capLang === 'ar' ? 'أدخل المفتاح أولاً' : 'Enter the key first', '⚠️'); return; }
        if (!sb){ toast(capLang === 'ar' ? 'هذه الميزة تحتاج ربط قاعدة البيانات' : 'This needs the database connection', '⚠️'); return; }
        try {
            const { data, error } = await sb.rpc('open_by_code', { p_code: trimmed });
            if (error || !data || !data.length){
                toast(capLang === 'ar' ? 'كبسولة غير موجودة أو المفتاح خاطئ' : 'Capsule not found or wrong key', '⚠️');
                trackEvent('capsule_open_failed', { lang: capLang });
                return;
            }
            const r = data[0];
            const list = $('capList');
            const cardObj = card({
                o_id: r.o_id,
                o_code: r.o_code,
                o_text: r.o_text,
                o_mood: r.o_mood,
                o_country: r.o_country,
                arrival_at: r.o_arrival_at,
                created_at: r.o_created,
                o_reads: r.o_reads
            }, true);
            allCards.unshift(cardObj);
            list.prepend(cardObj.el);
            cardObj.el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            toast(capLang === 'ar' ? 'تم فتح الكبسولة!' : 'Capsule opened!', '🔓');
            trackEvent('capsule_opened_by_code', {
                has_arrived: new Date(r.o_arrival_at) <= new Date(),
                lang: capLang
            });
            if (r.o_id && r.o_arrival_at && new Date(r.o_arrival_at) <= new Date()) {
                sb.rpc('read_capsule', { p_id: r.o_id }).catch(() => {});
            }
        } catch (e) {
            toast(capLang === 'ar' ? 'حدث خطأ، حاول مجدداً' : 'Something went wrong, try again', '⚠️');
        }
    }

    $('openCodeBtn').addEventListener('click', () => openByCode($('codeInput').value));
    $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') openByCode(e.target.value); });

    const urlCode = new URLSearchParams(location.search).get('capsule');
    if (urlCode){ $('codeInput').value = urlCode; openByCode(urlCode); }

    $('searchInput').addEventListener('input', e => {
        searchQ = e.target.value.trim();
        applyFilters();
    });

    document.querySelectorAll('.filter-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            activeFilter = chip.dataset.filter;
            trackEvent('capsules_filter_changed', { filter: activeFilter, lang: capLang });
            applyFilters();
        });
    });

    const LANGS = {
        ar: {
            toggle: 'EN', back: 'العودة للكوكب', title: '🛸 كبسولاتي',
            subtitle: 'جميع الكبسولات المرتبطة بجهازك أو حسابك',
            codeBoxTitle: 'افتح كبسولة بالمفتاح السري',
            openBtn: 'فتح',
            codeHint: 'أدخل مفتاح الكبسولة الذي وصلك — يعمل حتى قبل موعد الوصول',
            searchPh: '🔍 ابحث في كبسولاتك...',
            filterAll: 'الكل',
            filterArrived: '✅ وصلت',
            filterOrbit: '🛰️ في المدار'
        },
        en: {
            toggle: 'AR', back: '← Back to Planet', title: '🛸 My Capsules',
            subtitle: 'All capsules linked to your device or account',
            codeBoxTitle: 'Open a capsule with secret key',
            openBtn: 'Open',
            codeHint: 'Enter the capsule key you received — works even before arrival',
            searchPh: '🔍 Search your capsules...',
            filterAll: 'All',
            filterArrived: '✅ Arrived',
            filterOrbit: '🛰️ In Orbit'
        }
    };

    function applyCapLang(l){
        const wasChanging = (capLang !== l);
        capLang = l;
        try { localStorage.setItem('cc_lang', l); } catch (e) {}

        if (wasChanging) {
            trackEvent('language_toggle', { lang: l, page: 'capsules' });
        }

        if (window.CCI18N && typeof window.CCI18N.setLang === 'function') {
            try { window.CCI18N.setLang(l, false); } catch (e) {}
        }

        const D = LANGS[l] || LANGS.ar;
        document.documentElement.lang = l;
        document.documentElement.dir  = (l === 'ar') ? 'rtl' : 'ltr';

        $('capLangToggle').textContent = D.toggle;
        $('backLinkText').textContent  = D.back;
        $('pageTitle').textContent     = D.title;
        $('pageSubtitle').textContent  = D.subtitle;
        $('codeBoxTitle').textContent  = D.codeBoxTitle;
        $('openBtnText').textContent   = D.openBtn;
        $('codeHint').textContent      = D.codeHint;
        $('searchInput').placeholder   = D.searchPh;

        const chips = document.querySelectorAll('.filter-chip');
        if (chips[0]) chips[0].textContent = D.filterAll;
        if (chips[1]) chips[1].textContent = D.filterArrived;
        if (chips[2]) chips[2].textContent = D.filterOrbit;

        loadMine();
    }

    $('capLangToggle').addEventListener('click', () => applyCapLang(capLang === 'ar' ? 'en' : 'ar'));

    if (sb) {
        sb.auth.onAuthStateChange(() => {
            loadMine();
        });
    }

    applyCapLang(capLang);
})();
</script>
</body>
</html>
