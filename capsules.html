<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كبسولتي | Chronos Capsule</title>
    <!-- SEO -->
    <meta name="description" content="اعرض كبسولاتك الزمنية الخاصة وتابع مواعيد وصولها — كبسولة الزمن الكونية.">
    <meta name="theme-color" content="#010103">
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ══ إعادة تعيين أساسي ══ */
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',sans-serif}
        body{overflow-y:auto;background:#010103;color:#fff;min-height:100vh}
        button,a,select,input{cursor:pointer}
        /* ══ خلفية الفضاء ══ */
        body::before{content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse at 20% 50%,rgba(139,92,246,.08) 0%,transparent 60%),
                        radial-gradient(ellipse at 80% 20%,rgba(59,130,246,.06) 0%,transparent 50%),#010103;
            z-index:0;pointer-events:none}
        body::after{content:'';position:fixed;inset:0;
            background-image:radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.5) 0%,transparent 100%),
                radial-gradient(1px 1px at 25% 40%,rgba(255,255,255,.4) 0%,transparent 100%),
                radial-gradient(1px 1px at 50% 10%,rgba(255,255,255,.6) 0%,transparent 100%),
                radial-gradient(1px 1px at 70% 60%,rgba(255,255,255,.3) 0%,transparent 100%),
                radial-gradient(1px 1px at 90% 30%,rgba(255,255,255,.5) 0%,transparent 100%);
            z-index:0;pointer-events:none}
        /* ══ ترويسة ══ */
        .page-header{position:sticky;top:0;z-index:50;
            background:rgba(1,1,3,.85);backdrop-filter:blur(14px);
            border-bottom:1px solid rgba(255,255,255,.07);
            padding:14px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}
        .header-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
        .header-logo-icon{font-size:1.4rem}
        .header-logo-text{font-size:1.05rem;font-weight:900;
            background:linear-gradient(135deg,#a78bfa,#3b82f6);
            -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .header-actions{display:flex;align-items:center;gap:8px}
        .back-link{color:#a78bfa;text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px;
            padding:7px 14px;border:1px solid rgba(167,139,250,.3);border-radius:10px;transition:all .3s}
        .back-link:hover{color:#fff;border-color:#8b5cf6;background:rgba(139,92,246,.1)}
        .lang-toggle-cap{background:rgba(15,23,42,.7);border:1px solid rgba(255,255,255,.15);color:#cbd5e1;
            border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;backdrop-filter:blur(8px);transition:all .3s}
        .lang-toggle-cap:hover{border-color:#8b5cf6;color:#fff}
        /* ══ الصفحة الرئيسية ══ */
        .page{max-width:760px;margin:0 auto;padding:34px 20px 80px;min-height:calc(100vh - 56px);position:relative;z-index:1}
        .page-title{font-size:1.7rem;font-weight:900;color:#fff;margin-bottom:4px}
        .page-subtitle{font-size:.88rem;color:#64748b;margin-bottom:26px}
        /* ══ فلتر وبحث ══ */
        .filter-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
        .search-input{flex:1;min-width:180px;padding:10px 14px;background:rgba(15,23,42,.6);
            border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:.9rem;outline:none;
            transition:border-color .3s;backdrop-filter:blur(8px)}
        .search-input:focus{border-color:#8b5cf6}
        .search-input::placeholder{color:#64748b}
        .filter-chips{display:flex;gap:7px;flex-wrap:wrap}
        .filter-chip{padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;
            border:1px solid rgba(255,255,255,.15);background:rgba(15,23,42,.6);color:#94a3b8;transition:all .3s}
        .filter-chip:hover{border-color:#8b5cf6;color:#fff}
        .filter-chip.active{background:rgba(139,92,246,.25);border-color:#8b5cf6;color:#fff}
        /* ══ بطاقات الكبسولات ══ */
        .capsule-list{display:flex;flex-direction:column;gap:14px}
        .cap-card{background:rgba(15,23,42,.65);border:1px solid rgba(255,255,255,.1);border-radius:16px;
            padding:20px 22px;backdrop-filter:blur(10px);transition:border-color .3s,transform .3s,box-shadow .3s}
        .cap-card:hover{border-color:rgba(139,92,246,.5);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
        .cap-card.in-orbit{border-inline-start:3px solid #fbbf24}
        .cap-card.arrived{border-inline-start:3px solid #34d399}
        .cap-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
        .cap-status{font-size:11.5px;padding:5px 12px;border-radius:999px;font-weight:700}
        .cap-status.orbit{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.2)}
        .cap-status.done{background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.2)}
        .cap-date{font-size:11.5px;color:#94a3b8;direction:ltr}
        .cap-text{color:#e2e8f0;line-height:1.75;margin-bottom:14px;font-size:.975rem}
        .cap-text.locked{color:#64748b;font-style:italic;font-size:.9rem;
            background:rgba(251,191,36,.05);border:1px dashed rgba(251,191,36,.2);
            border-radius:10px;padding:12px 14px}
        .cap-stats{display:flex;gap:16px;font-size:12px;color:#94a3b8;flex-wrap:wrap;align-items:center}
        .cap-stats b{color:#a78bfa;direction:ltr;display:inline-block}
        .cap-countdown{font-size:13px;color:#fbbf24;margin-top:10px;direction:ltr;
            font-family:monospace;background:rgba(251,191,36,.06);border-radius:8px;padding:6px 10px;display:inline-block}
        .cap-countdown.done-label{color:#34d399;background:rgba(52,211,153,.06)}
        /* ══ أزرار الكبسولة ══ */
        .cap-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
        .btn-share{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;
            background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#60a5fa;transition:all .3s}
        .btn-share:hover{background:rgba(59,130,246,.25);color:#fff}
        .btn-copy-code{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;
            background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);color:#a78bfa;transition:all .3s}
        .btn-copy-code:hover{background:rgba(139,92,246,.25);color:#fff}
        /* ══ حركة وصول الكبسولة ══ */
        @keyframes capsuleArrive{
            0%{transform:scale(.8) translateY(-20px);opacity:0}
            60%{transform:scale(1.04) translateY(4px);opacity:1}
            80%{transform:scale(.98) translateY(-2px)}
            100%{transform:scale(1) translateY(0);opacity:1}}
        .cap-card.just-arrived{animation:capsuleArrive .7s cubic-bezier(.34,1.56,.64,1) forwards}
        @keyframes openPulse{
            0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.4)}
            50%{box-shadow:0 0 0 14px rgba(52,211,153,0)}}
        .cap-card.arrived.just-arrived{animation:capsuleArrive .7s cubic-bezier(.34,1.56,.64,1) forwards,
            openPulse 1.2s ease .5s}
        /* ══ حالة فارغة ══ */
        .empty-state{text-align:center;padding:70px 20px;color:#94a3b8}
        .empty-state .ico{font-size:52px;margin-bottom:16px;opacity:.7}
        .empty-state p{margin-bottom:22px;line-height:1.7}
        .empty-state a{display:inline-block;padding:12px 26px;background:linear-gradient(135deg,#6d28d9,#2563eb);
            color:#fff;border-radius:12px;text-decoration:none;font-weight:700;transition:transform .3s}
        .empty-state a:hover{transform:translateY(-3px)}
        .hint{font-size:12px;color:#64748b;margin-top:12px;line-height:1.6}
        /* ══ إشعار ══ */
        .cc-toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
            background:rgba(15,23,42,.95);border:1px solid rgba(139,92,246,.4);border-radius:14px;
            padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:14px;
            backdrop-filter:blur(16px);z-index:9999;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);
            pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.4)}
        .cc-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        /* ══ جوال ══ */
        @media(max-width:600px){
            .page-header{padding:12px 16px}
            .page{padding:24px 14px 60px}
            .page-title{font-size:1.4rem}
            .filter-bar{flex-direction:column;align-items:stretch}
            .search-input{width:100%}
        }
        .code-box button:active{transform:translateY(0)}
    </style>
</head>
<body>
<!-- ══ الترويسة ══ -->
<header class="page-header">
    <a href="index.html" class="header-logo">
        <span class="header-logo-icon">🚀</span>
        <span class="header-logo-text">CHRONOS CAPSULE</span>
    </a>
    <div class="header-actions">
        <button class="lang-toggle-cap" id="capLangToggle">EN</button>
        <a href="archive.html" class="back-link">🗂️ <span id="archiveLinkText">الأرشيف</span></a>
        <a href="index.html" class="back-link">
            <span>←</span>
            <span id="backLinkText">العودة للكوكب</span>
        </a>
    </div>
</header>

<!-- ══ الإشعار ══ -->
<div class="cc-toast" id="capToast"><span></span></div>

<!-- ══ المحتوى ══ -->
<main class="page">
    <h1 class="page-title" id="pageTitle">🛸 كبسولاتي</h1>
    <p class="page-subtitle" id="pageSubtitle">جميع الكبسولات المرتبطة بجهازك</p>

    <!-- صندوق المفتاح -->
    <div class="code-box">
        <div class="code-box-title">🔑 <span id="codeBoxTitle">افتح كبسولة بالمفتاح السري</span></div>
        <div class="code-box-row">
            <input type="text" id="codeInput" placeholder="XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">
            <button id="openCodeBtn" type="button">🔓 <span id="openBtnText">فتح</span></button>
        </div>
        <p class="hint" id="codeHint">أدخل مفتاح الكبسولة الذي وصلك — يعمل حتى قبل موعد الوصول</p>
    </div>

    <!-- شريط البحث والفلتر -->
    <div class="filter-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث في كبسولاتك...">
        <div class="filter-chips" id="filterChips">
            <button class="filter-chip active" data-filter="all">الكل</button>
            <button class="filter-chip" data-filter="arrived">✅ وصلت</button>
            <button class="filter-chip" data-filter="orbit">🛰️ في المدار</button>
        </div>
    </div>

    <!-- قائمة الكبسولات -->
    <div class="capsule-list" id="capList"></div>

    <!-- حالة فارغة -->
    <div class="empty-state" id="emptyState" style="display:none">
        <div class="ico">🛸</div>
        <p id="emptyText">لم تُطلق أي كبسولة بعد<br>ابدأ رحلتك عبر الزمن الآن</p>
        <a href="index.html" id="emptyLink">إطلاق أول كبسولة</a>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="i18n.js"></script>
<script>
(function(){
    "use strict";
    /* ══ إعداد Supabase — رابط صحيح ══ */
    const SB_URL  = 'https://sylnhrtgrxfacskjaxlq.supabase.co';
    const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN5bG5ocnRncnhmYWNza2pheGxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4MTA4MTcsImV4cCI6MjEwNDM4NjgxN30.gPFS04us1m7L4wZn0nvioctVQw86M7vEy2y3V5BELYQ';
    const sb = (window.supabase) ? supabase.createClient(SB_URL, SB_KEY) : null;

    const $ = id => document.getElementById(id);
    const T = k => (window.CCI18N ? CCI18N.t(k) : k);
    const MOOD_ICO = {hope:'💙',nostalgia:'💜',secret:'💚',confession:'💛',bold:'❤️'};

    let _toastTimer;
    function toast(msg, ico='🚀'){
        const el = $('capToast');
        if(!el) return;
        el.innerHTML = `<span>${ico}</span> <span>${msg}</span>`;
        el.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(()=>el.classList.remove('show'), 3500);
    }

    function fmt(iso){
        if (!iso) return '';
        try{
            return new Date(iso).toLocaleDateString(
                (window.CCI18N && CCI18N.lang==='ar')?'ar-EG':'en-GB',
                {year:'numeric',month:'short',day:'numeric'});
        }catch(e){return iso.slice(0,10)}
    }

    function countdown(iso){
        const diff = new Date(iso) - Date.now();
        if (diff <= 0) return null;
        const d = Math.floor(diff/864e5);
        const h = Math.floor((diff%864e5)/36e5);
        const m = Math.floor((diff%36e5)/6e4);
        if (d > 0) return `${d}d ${h}h ${m}m`;
        return `${h}h ${m}m`;
    }

    let allCards = [];
    let activeFilter = 'all';
    let searchQ = '';

    function applyFilters(){
        let visible = 0;
        allCards.forEach(({el, arrived, text})=>{
            const matchFilter = activeFilter==='all' || (activeFilter==='arrived'&&arrived) || (activeFilter==='orbit'&&!arrived);
            const matchSearch = !searchQ || text.toLowerCase().includes(searchQ.toLowerCase());
            el.style.display = (matchFilter && matchSearch) ? '' : 'none';
            if (matchFilter && matchSearch) visible++;
        });
        $('emptyState').style.display = visible===0 ? 'block' : 'none';
    }

    function shareCapsule(code, text){
        const url = `${location.origin}${location.pathname}?capsule=${encodeURIComponent(code)}`;
        if (navigator.share){
            navigator.share({title:'كبسولة الزمن', text: text.slice(0,80)+'…', url}).catch(()=>{});
        } else {
            navigator.clipboard.writeText(url).then(()=>toast('تم نسخ رابط الكبسولة!','🔗'));
        }
    }

    function copyCode(code){
        navigator.clipboard.writeText(code).then(()=>toast('تم نسخ المفتاح!','🔑')).catch(()=>{
            toast(code,'🔑');
        });
    }

    function card(c, animate=false){
        const arrived = !c.arrival_at || new Date(c.arrival_at) <= new Date();
        const rawText = (c.o_text||c.text||'');
        const el = document.createElement('div');
        el.className = 'cap-card ' + (arrived?'arrived':'in-orbit') + (animate?' just-arrived':'');
        const codeVal = c.o_code||c.code||'';
        const isAr = (window.CCI18N && CCI18N.lang==='ar');
        const lockedHtml = !arrived
            ? `<div class="cap-text locked">🔒 ${isAr?'الرسالة مقفلة حتى موعد الوصول':'Message locked until arrival'}</div>`
            : `<div class="cap-text">${rawText.replace(/</g,'&lt;')}</div>`;

        el.innerHTML = `
            <div class="cap-top">
                <span class="cap-status ${arrived?'done':'orbit'}">${arrived?'✅ هبطت على الكوكب':'🛰️ تسبح في المدار'}</span>
                <span class="cap-date">${fmt(c.arrival_at||c.created_at)}</span>
            </div>
            ${lockedHtml}
            <div class="cap-stats">
                <span>${MOOD_ICO[c.o_mood||c.mood]||'✨'} ${c.o_country&&window.CCI18N?CCI18N.countryLabel(c.o_country):''}</span>
                <span>👁️ <b>${c.o_reads??c.reads??0}</b> ${isAr?'قراءة':'reads'}</span>
                ${codeVal?`<span>🔑 <b style="font-size:11px;font-family:monospace">${codeVal.slice(0,8)}…</b></span>`:''}
            </div>
            ${!arrived&&c.arrival_at?`<div class="cap-countdown" data-arrival="${c.arrival_at}">⏳ T-${countdown(c.arrival_at)||'—'}</div>`:''}
            <div class="cap-actions">
                ${codeVal?`<button class="btn-copy-code" data-code="${codeVal}">🔑 نسخ المفتاح</button>`:''}
                ${arrived&&codeVal?`<button class="btn-share" data-code="${codeVal}" data-text="${rawText.slice(0,80).replace(/"/g,'&quot;')}">🔗 مشاركة</button>`:''}
            </div>`;

        el.querySelector('.btn-copy-code')?.addEventListener('click', ()=>copyCode(codeVal));
        el.querySelector('.btn-share')?.addEventListener('click', ()=>shareCapsule(codeVal, rawText));

        if(animate) setTimeout(()=>el.classList.remove('just-arrived'), 1500);

        return {el, arrived, text: rawText};
    }

    setInterval(()=>{
        document.querySelectorAll('.cap-countdown[data-arrival]').forEach(el=>{
            const cd = countdown(el.dataset.arrival);
            if (cd) el.textContent = `⏳ T-${cd}`;
            else { el.textContent='✅ وصلت للتو!'; el.className='cap-countdown done-label'; }
        });
    }, 1000);

    async function loadMine(){
        const list = $('capList');
        list.innerHTML = '';
        allCards = [];
        let items = [];

        if (sb){
            const dev = localStorage.getItem('cc_device');
            if (dev){
                try{
                    const {data,error} = await sb.rpc('get_my_capsules',{p_device_hash:dev});
                    if (!error && data) items = data.map(r=>({
                        o_code:r.o_code, o_text:r.o_text, o_mood:r.o_mood, o_country:r.o_country,
                        arrival_at:r.o_arrival_at, created_at:r.o_created, o_reads:r.o_reads
                    }));
                }catch(e){}
            }
        }

        if (!items.length){
            try{
                items = (JSON.parse(localStorage.getItem('chronos_capsules_v1'))||[])
                    .map(m=>({o_text:m.text,o_mood:m.mood,o_country:m.country,
                        arrival_at:m.arrivalISO||null,created_at:m.ts||new Date().toISOString(),o_reads:0}));
            }catch(e){}
        }

        if (!items.length){ $('emptyState').style.display='block'; return; }
        items.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
        items.forEach(c=>{
            const cardObj = card(c);
            allCards.push(cardObj);
            list.appendChild(cardObj.el);
        });
    }

    async function openByCode(code){
        const trimmed = code.trim();
        if (!trimmed){ toast('أدخل المفتاح أولاً','⚠️'); return; }
        if (!sb){ toast('هذه الميزة تحتاج ربط قاعدة البيانات','⚠️'); return; }
        try{
            const {data,error} = await sb.rpc('open_by_code',{p_code:trimmed});
            if (error||!data||!data.length){ toast('كبسولة غير موجودة أو المفتاح خاطئ','⚠️'); return; }
            const r = data[0];
            const list = $('capList');
            const cardObj = card({
                o_code:r.o_code, o_text:r.o_text, o_mood:r.o_mood, o_country:r.o_country,
                arrival_at:r.o_arrival_at, created_at:r.o_created, o_reads:r.o_reads
            }, true);
            allCards.unshift(cardObj);
            list.prepend(cardObj.el);
            cardObj.el.scrollIntoView({behavior:'smooth',block:'center'});
            toast('تم فتح الكبسولة!','🔓');
            if (r.o_id && r.o_arrival_at && new Date(r.o_arrival_at)<=new Date())
                sb.rpc('read_capsule',{p_id:r.o_id}).catch(()=>{});
        }catch(e){ toast('حدث خطأ، حاول مجدداً','⚠️'); }
    }

    $('openCodeBtn').addEventListener('click',()=>openByCode($('codeInput').value));
    $('codeInput').addEventListener('keydown',e=>{ if(e.key==='Enter') openByCode(e.target.value); });

    const urlCode = new URLSearchParams(location.search).get('capsule');
    if (urlCode){ $('codeInput').value = urlCode; openByCode(urlCode); }

    const LANGS = {
        ar:{toggle:'EN',back:'العودة للكوكب',archive:'الأرشيف',title:'🛸 كبسولاتي',subtitle:'جميع الكبسولات المرتبطة بجهازك',
            codeBoxTitle:'افتح كبسولة بالمفتاح السري',openBtn:'فتح',codeHint:'أدخل مفتاح الكبسولة الذي وصلك',
            searchPh:'🔍 ابحث في كبسولاتك...',emptyText:'لم تُطلق أي كبسولة بعد<br>ابدأ رحلتك عبر الزمن الآن',
            emptyLink:'إطلاق أول كبسولة',filterAll:'الكل',filterArrived:'✅ وصلت',filterOrbit:'🛰️ في المدار'},
        en:{toggle:'AR',back:'← Back to Planet',archive:'Archive',title:'🛸 My Capsules',subtitle:'All capsules linked to your device',
            codeBoxTitle:'Open a capsule with secret key',openBtn:'Open',codeHint:'Enter the capsule key you received',
            searchPh:'🔍 Search your capsules...',emptyText:'No capsules launched yet<br>Start your time travel now',
            emptyLink:'Launch first capsule',filterAll:'All',filterArrived:'Arrived',filterOrbit:'🛰️ In Orbit'}
    };
    let capLang = (()=>{ try{return localStorage.getItem('cc_lang')||'ar';}catch(e){return 'ar';} })();

    function applyCapLang(l){
        capLang = l;
        try{localStorage.setItem('cc_lang',l);}catch(e){}
        const D = LANGS[l]||LANGS.ar;
        document.documentElement.lang = l;
        document.documentElement.dir = l==='ar'?'rtl':'ltr';
        $('capLangToggle').textContent = D.toggle;
        $('backLinkText').textContent = D.back;
        $('archiveLinkText').textContent = D.archive;
        $('pageTitle').textContent = D.title;
        $('pageSubtitle').textContent = D.subtitle;
        $('codeBoxTitle').textContent = D.codeBoxTitle;
        $('openBtnText').textContent = D.openBtn;
        $('codeHint').textContent = D.codeHint;
        $('searchInput').placeholder = D.searchPh;
        $('emptyText').innerHTML = D.emptyText;
        $('emptyLink').textContent = D.emptyLink;
        const chips = document.querySelectorAll('.filter-chip');
        if(chips[0]) chips[0].textContent = D.filterAll;
        if(chips[1]) chips[1].textContent = D.filterArrived;
        if(chips[2]) chips[2].textContent = D.filterOrbit;
    }

    $('capLangToggle').addEventListener('click',()=>applyCapLang(capLang==='ar'?'en':'ar'));
    applyCapLang(capLang);

    loadMine();
})();
</script>
</body>
</html>
