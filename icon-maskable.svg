    </radialGradient>
    <linearGradient id="ccRingGrad" gradientUnits="userSpaceOnUse" x1="843" y1="351" x2="181" y2="673">
      <stop offset="0" stop-color="#3AE1FF"/>
      <stop offset="1" stop-color="#D355FF"/>
    </linearGradient>
    <linearGradient id="ccChrome" x1="0" y1="0" x2="0" y2="1">
