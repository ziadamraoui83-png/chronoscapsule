<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
    <!-- ═══ منع الوميض الأبيض — inline (critical CSS) ═══ -->
    <style id="cc_critical">
        html { background: #010103 !important; }
        body { background: #010103; opacity: 0; transition: opacity 0.35s ease; }
        body.cc-loaded { opacity: 1; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
            margin: 20px;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .btn-submit:hover:not(:disabled) {
            background: #0ea5e9;
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 13px;
        }
        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #475569;
        }
        .separator::before { margin-left: 10px; }
        .separator::after { margin-right: 10px; }

        .btn-google {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #333;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s;
            font-size: 14px;
        }
        .btn-google:hover:not(:disabled) {
            background: #f1f5f9;
        }
        .btn-google:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* رسالة التنبيه */
        .alert {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
            line-height: 1.5;
        }
        .alert.show { display: block; }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
        }
        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.5);
            color: #86efac;
        }
        .alert-info {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.5);
            color: #7dd3fc;
        }

        .toggle-mode {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .toggle-mode a {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .toggle-mode a:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 id="formTitle">تسجيل الدخول</h2>

        <div id="alertBox" class="alert"></div>

        <!-- نموذج تسجيل الدخول / التسجيل -->
        <form id="loginForm" autocomplete="on">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" required
                       placeholder="name@example.com"
                       autocomplete="email" autocapitalize="off">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" required
                       placeholder="••••••••"
                       autocomplete="current-password"
                       minlength="6">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">دخول</button>
        </form>

        <div class="separator">أو</div>

        <!-- زر تسجيل الدخول بواسطة غوغل -->
        <button type="button" class="btn-google" id="googleLoginBtn">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.15v3.14C3.15 21.32 7.23 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.6H1.15C.42 8.1 0 9.99 0 12s.42 3.9 1.15 5.4l4.12-3.16z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.15 2.68 1.15 6.6l4.12 3.14c.95-2.85 3.6-4.99 6.73-4.99z"/>
            </svg>
            التسجيل باستخدام Google
        </button>

        <div class="toggle-mode">
            <span id="toggleText">ليس لديك حساب؟</span>
            <a id="toggleMode">إنشاء حساب جديد</a>
        </div>
    </div>

    <!-- ═══ Supabase JS SDK + إعدادات المشروع ═══ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20260915"></script>

    <script>
        'use strict';

        /* ═══ Debug Mode - فقط في localhost أو ?debug ═══ */
        const __CC_DEBUG = location.hostname === 'localhost' ||
                           location.hostname === '127.0.0.1' ||
                           location.search.includes('debug');

        /* ═══ حالة الواجهة: login | signup ═══ */
        let mode = 'login';

        /* ═══ تهيئة عميل Supabase ═══ */
        let sb = null;

        function initSupabase() {
            if (sb) return sb;
            try {
                if (window.CC_CONFIG && window.CC_CONFIG.SUPABASE_URL &&
                    window.CC_CONFIG.SUPABASE_ANON_KEY && window.supabase) {
                    sb = window.supabase.createClient(
                        window.CC_CONFIG.SUPABASE_URL,
                        window.CC_CONFIG.SUPABASE_ANON_KEY
                    );
                    if (__CC_DEBUG) console.log('✅ Supabase initialized');
                }
            } catch (e) {
                console.error('فشل تهيئة Supabase:', e);
            }
            return sb;
        }

        /* ✅ إصلاح Race Condition: انتظار تحميل Supabase SDK
           قبل التخلي عن الطلب */
        function waitForSupabase(maxRetries = 30, intervalMs = 100) {
            return new Promise((resolve, reject) => {
                if (initSupabase()) return resolve(sb);

                let attempts = 0;
                const check = () => {
                    attempts++;
                    if (initSupabase()) {
                        resolve(sb);
                    } else if (attempts >= maxRetries) {
                        reject(new Error('Supabase SDK failed to load after ' + (maxRetries * intervalMs / 1000) + 's'));
                    } else {
                        setTimeout(check, intervalMs);
                    }
                };
                check();
            });
        }

        // محاولة أولية للتهيئة
        initSupabase();

        /* ═══ عناصر DOM ═══ */
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const googleBtn = document.getElementById('googleLoginBtn');
        const toggleModeLink = document.getElementById('toggleMode');
        const toggleText = document.getElementById('toggleText');
        const formTitle = document.getElementById('formTitle');
        const alertBox = document.getElementById('alertBox');

        /* ═══ عرض رسالة (نجاح / خطأ / معلومات) ═══ */
        function showAlert(type, message) {
            alertBox.className = 'alert alert-' + type + ' show';
            alertBox.textContent = message;
        }

        function hideAlert() {
            alertBox.className = 'alert';
            alertBox.textContent = '';
        }

        /* ═══ تبديل بين الدخول والتسجيل ═══ */
        function setMode(newMode) {
            mode = newMode;
            hideAlert();
            if (mode === 'login') {
                formTitle.textContent = 'تسجيل الدخول';
                submitBtn.textContent = 'دخول';
                toggleText.textContent = 'ليس لديك حساب؟';
                toggleModeLink.textContent = 'إنشاء حساب جديد';
                passwordInput.setAttribute('autocomplete', 'current-password');
            } else {
                formTitle.textContent = 'إنشاء حساب جديد';
                submitBtn.textContent = 'إنشاء الحساب';
                toggleText.textContent = 'لديك حساب بالفعل؟';
                toggleModeLink.textContent = 'تسجيل الدخول';
                passwordInput.setAttribute('autocomplete', 'new-password');
            }
        }

        toggleModeLink.addEventListener('click', function(e) {
            e.preventDefault();
            setMode(mode === 'login' ? 'signup' : 'login');
        });

        /* ═══ التحقق من جودة كلمة المرور ═══ */
        function validatePassword(pwd) {
            if (pwd.length < 6) {
                return 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            }
            return null;
        }

        /* ═══ معالجة تسجيل الدخول / التسجيل ═══ */
        async function handleSubmit(e) {
            e.preventDefault();
            hideAlert();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            /* تحقق بسيط من صحة المدخلات قبل إرسال الطلب */
            if (!email || !password) {
                showAlert('error', 'الرجاء إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }

            const pwdError = validatePassword(password);
            if (pwdError) {
                showAlert('error', pwdError);
                return;
            }

            /* تعطيل الزر أثناء الطلب */
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = originalText + '<span class="spinner"></span>';

            try {
                /* ✅ إصلاح Race Condition: انتظار Supabase SDK */
                const client = sb || await waitForSupabase();
                if (!client) {
                    throw new Error('تعذّر تحميل SDK. تحقق من اتصال الإنترنت.');
                }
                sb = client;

                let result;
                if (mode === 'login') {
                    /* تسجيل الدخول بالبريد وكلمة المرور */
                    result = await sb.auth.signInWithPassword({ email, password });
                } else {
                    /* إنشاء حساب جديد */
                    result = await sb.auth.signUp({
                        email,
                        password,
                        options: { emailRedirectTo: window.location.origin + '/index.html' }
                    });
                }

                if (result.error) throw result.error;

                /* في حالة التسجيل: قد يتطلب تأكيد البريد */
                if (mode === 'signup' && result.data?.user && !result.data?.session) {
                    showAlert('success', 'تم إنشاء حسابك! تحقق من بريدك الإلكتروني لتأكيد الحساب قبل تسجيل الدخول.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                    setMode('login');
                    return;
                }

                /* حفظ بيانات المستخدم وتوجيهه للصفحة الرئيسية */
                if (result.data?.user || result.data?.session) {
                    try {
                        localStorage.setItem('cc_user', JSON.stringify(result.data.user));
                    } catch (e) {}

                    showAlert('success', mode === 'login' ? 'تم تسجيل الدخول بنجاح! جاري التحويل...' : 'تم إنشاء الحساب بنجاح! جاري التحويل...');

                    setTimeout(function() {
                        const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';
                        window.location.href = redirect;
                    }, 800);
                } else {
                    throw new Error('استجابة غير متوقعة من الخادم');
                }
            } catch (err) {
                if (__CC_DEBUG) console.error('Auth error:', err);
                let msg = err.message || 'حدث خطأ غير متوقع';
                /* ترجمة الأخطاء الشائعة */
                if (msg.includes('Invalid login credentials')) {
                    msg = 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
                } else if (msg.includes('Email not confirmed')) {
                    msg = 'يجب تأكيد بريدك الإلكتروني أولاً. تحقق من بريدك.';
                } else if (msg.includes('already registered')) {
                    msg = 'هذا البريد الإلكتروني مُسجّل بالفعل. حاول تسجيل الدخول.';
                } else if (msg.includes('rate limit')) {
                    msg = 'محاولات كثيرة. انتظر قليلاً قبل المحاولة مرة أخرى.';
                } else if (msg.includes('SDK failed to load')) {
                    msg = 'تعذّر تحميل خدمة المصادقة. تحقق من اتصالك وحاول مرة أخرى.';
                }
                showAlert('error', msg);
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }

        form.addEventListener('submit', handleSubmit);

        /* ═══ تسجيل الدخول عبر Google OAuth ═══ */
        googleBtn.addEventListener('click', async function() {
            googleBtn.disabled = true;
            const originalHTML = googleBtn.innerHTML;
            googleBtn.innerHTML = '<span class="spinner"></span> جاري الفتح...';

            try {
                /* ✅ انتظار Supabase SDK */
                const client = sb || await waitForSupabase();
                if (!client) {
                    throw new Error('تعذّر تحميل SDK');
                }
                sb = client;

                const { data, error } = await sb.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/index.html'
                    }
                });
                if (error) throw error;
                /* سيتم توجيه المستخدم تلقائياً إلى Google ثم العودة */
            } catch (err) {
                if (__CC_DEBUG) console.error('Google OAuth error:', err);
                let msg = err.message || 'فشل تسجيل الدخول بـ Google';
                if (msg.includes('provider is not enabled') || msg.includes('not enabled')) {
                    msg = 'تسجيل الدخول بـ Google غير مُفعّل. فعّله من لوحة تحكم Supabase.';
                } else if (msg.includes('SDK failed to load') || msg.includes('تعذّر تحميل SDK')) {
                    msg = 'تعذّر تحميل خدمة المصادقة. تحقق من اتصالك.';
                }
                showAlert('error', msg);
                googleBtn.disabled = false;
                googleBtn.innerHTML = originalHTML;
            }
        });

        /* ═══ إذا كان المستخدم مسجلاً دخوله بالفعل، وجهه للصفحة الرئيسية ═══ */
        async function checkExistingSession() {
            try {
                const client = await waitForSupabase(10, 100);
                if (!client) return;
                const { data } = await client.auth.getSession();
                if (data?.session) {
                    /* المستخدم مسجل دخوله بالفعل */
                    if (__CC_DEBUG) console.log('✅ Session found, redirecting...');
                    window.location.href = 'index.html';
                }
            } catch (e) {
                /* تجاهل - لن تمنع المستخدم من الصفحة */
                if (__CC_DEBUG) console.warn('Session check failed:', e);
            }
        }

        checkExistingSession();
        setMode('login');
    </script>
    <script src="transitions.js?v=20260915"></script>
</body>
</html>
